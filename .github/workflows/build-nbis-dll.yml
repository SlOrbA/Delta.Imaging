name: Build nbis DLL

# Builds nbis32.dll / nbis64.dll with MSVC.
#
# Two modes (input `libs`):
#   committed – link against the NBIS static libraries committed in
#           Delta.Wsq/nbis/lib32 and lib64. Fast (no MSYS2). Used by ci.yml
#           and release.yml, so CI tests exactly what developers build locally.
#   source    – first rebuild the NBIS static libraries from source with MSYS2 +
#           MinGW-w64 (see Delta.Wsq/nbis/BUILDING.md): the NBIS commit named
#           in Delta.Wsq/nbis/nbis-source.env with Delta.Wsq/nbis/patches
#           applied. Verifies the source build still works on current runner
#           images; the resulting `nbis-static-libs` artifact is used to
#           refresh the committed libraries.
#
# The source build also fuzzes the decoder (job `fuzz`): the same sources,
# built for Linux with AddressSanitizer.
#
# The source build runs on PRs that change this workflow, the patches, the
# wrapper or the fuzzer, weekly (to catch runner / MSYS2 drift early) and on
# demand.
on:
  workflow_call:
    inputs:
      libs:
        description: "committed = use the .a files in the repo, source = rebuild them with MSYS2"
        type: string
        default: committed
      ref:
        description: "Git ref to build (default: the triggering commit)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      libs:
        description: "Which NBIS static libraries to link against"
        type: choice
        options: [source, committed]
        default: source
  pull_request:
    paths:
      - .github/workflows/build-nbis-dll.yml
      - Delta.Wsq/nbis/nbis-source.env
      - Delta.Wsq/nbis/patches/**
      - Delta.Wsq/nbis/fuzz/**
      - Delta.Wsq/nbis/nistwsq.cpp
      - Delta.Wsq/nbis/nistwsq.h
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC

permissions:
  contents: read

env:
  # Force GitHub Actions to use Node.js 24 (Node.js 20 deprecated June 2, 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build nbis32.dll / nbis64.dll
    runs-on: windows-latest
    env:
      # Direct pull_request / schedule runs have no inputs (inputs.libs is
      # null) → build from source. Do not test github.event_name here: when
      # called from ci.yml it is the caller's event (e.g. pull_request).
      FROM_SOURCE: ${{ inputs.libs != 'committed' }}

    steps:
      # ── Repository checkout ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # ── MSYS2 with both MinGW toolchains ──────────────────────────────────
      # The msys2/setup-msys2 action installs MSYS2 to C:\msys64 and registers
      # the `msys2` shell command used in later steps.
      # cache: true reuses the package cache across runs (saves ~1 min).
      - name: Set up MSYS2
        if: env.FROM_SOURCE == 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          update: true
          cache: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-x86_64-gcc
            make

      # ── Clone NBIS source into two separate trees ──────────────────────────
      # setup.sh modifies files in the source tree (rules.mak, arch.mak, …),
      # so 32-bit and 64-bit builds must use separate directories.
      # Always a fresh clone: the source build must start from clean sources.
      # We clone with the runner's pre-installed git (PowerShell) to avoid
      # PATH issues inside the MSYS2 login shell.
      # The commit is pinned in nbis-source.env; the patches harden the WSQ
      # decoder against corrupted input (see Delta.Wsq/nbis/BUILDING.md).
      - name: Clone and patch NBIS source
        if: env.FROM_SOURCE == 'true'
        shell: pwsh
        run: |
          $source = @{}
          foreach ($line in Get-Content Delta.Wsq\nbis\nbis-source.env) {
            if ($line -match '^([A-Z_]+)=(.+)$') { $source[$Matches[1]] = $Matches[2].Trim() }
          }
          Write-Host "NBIS $($source.NBIS_REPOSITORY) @ $($source.NBIS_COMMIT)"

          # autocrlf off: the patches expect the LF line endings of the repository.
          git clone --config core.autocrlf=false $source.NBIS_REPOSITORY C:\nbis-src-32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C C:\nbis-src-32 checkout --quiet $source.NBIS_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $patches = @(Get-ChildItem Delta.Wsq\nbis\patches\*.patch | Sort-Object Name)
          if ($patches.Count -eq 0) {
            Write-Host "::error::no patches found in Delta.Wsq/nbis/patches"
            exit 1
          }
          foreach ($patch in $patches) {
            Write-Host "Applying $($patch.Name)"
            git -C C:\nbis-src-32 apply --whitespace=nowarn $patch.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          Copy-Item -Recurse -Force C:\nbis-src-32 C:\nbis-src-64

      # ── Build 32-bit static libraries ─────────────────────────────────────
      # shell: msys2 {0} uses the shell registered by setup-msys2.
      # Setting MSYSTEM=MINGW32 in env causes the login shell to put
      # /mingw32/bin first in PATH, making gcc = i686-w64-mingw32-gcc.
      - name: Build NBIS 32-bit static libraries
        if: env.FROM_SOURCE == 'true'
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW32
        run: |
          mkdir -p /c/NBISBuild32
          cd /c/nbis-src-32
          ./setup.sh C:/NBISBuild32 --MSYS --STDLIBS --32
          # GCC >= 10 defaults to -fno-common; NBIS defines globals in header
          # files, which causes "multiple definition" linker errors.
          # Patch rules.mak (generated by setup.sh) to add -fcommon to CFLAGS.
          sed -i 's/^\(CFLAGS.*:=\)/\1 -fcommon/' rules.mak
          make config
          make it
          make install

      # ── Build 64-bit static libraries ─────────────────────────────────────
      # MSYSTEM=MINGW64 puts /mingw64/bin first → gcc = x86_64-w64-mingw32-gcc
      - name: Build NBIS 64-bit static libraries
        if: env.FROM_SOURCE == 'true'
        shell: msys2 {0}
        env:
          MSYSTEM: MINGW64
        run: |
          mkdir -p /c/NBISBuild64
          cd /c/nbis-src-64
          ./setup.sh C:/NBISBuild64 --MSYS --STDLIBS --64
          # Same -fcommon fix as 32-bit build above.
          sed -i 's/^\(CFLAGS.*:=\)/\1 -fcommon/' rules.mak
          make config
          make it
          make install

      # ── Copy .a files into the project ────────────────────────────────────
      # INSTALL_ROOT_LIB_DIR in rules_msys.mak.src is $(FINAL_INSTALLATION_DIR)/lib,
      # so 'make install' puts the .a files at C:\NBISBuild{32,64}\lib\.
      - name: Copy static libraries into project
        if: env.FROM_SOURCE == 'true'
        shell: pwsh
        run: |
          Write-Host "32-bit libraries:"
          Get-ChildItem C:\NBISBuild32\lib\*.a | Select-Object -ExpandProperty Name
          Write-Host "64-bit libraries:"
          Get-ChildItem C:\NBISBuild64\lib\*.a | Select-Object -ExpandProperty Name

          Copy-Item C:\NBISBuild32\lib\*.a Delta.Wsq\nbis\lib32\ -Force
          Copy-Item C:\NBISBuild64\lib\*.a Delta.Wsq\nbis\lib64\ -Force

          # Record what the libraries were built from. ci.yml compares this
          # with nbis-source.env and patches/, so the committed libraries
          # cannot fall behind them. Same format as the lint step computes:
          # SHA-256 over the patch files in name order.
          $commit = (git -C C:\nbis-src-32 rev-parse HEAD).Trim()
          $bytes = [System.Collections.Generic.List[byte]]::new()
          foreach ($patch in Get-ChildItem Delta.Wsq\nbis\patches\*.patch | Sort-Object Name) {
            $bytes.AddRange([System.IO.File]::ReadAllBytes($patch.FullName))
          }
          $hash = [System.BitConverter]::ToString(
            [System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes.ToArray())).Replace('-', '').ToLowerInvariant()
          $stamp = "NBIS_COMMIT=$commit`nPATCHES_SHA256=$hash`n"
          foreach ($dir in 'lib32', 'lib64') {
            [System.IO.File]::WriteAllText("$PWD\Delta.Wsq\nbis\$dir\SOURCE", $stamp)
          }
          Write-Host $stamp

      # ── Build the DLL with MSVC ────────────────────────────────────────────
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Build nbis32.dll  (Release | Win32)
        run: |
          msbuild Delta.Wsq\nbis\nbis.vcxproj `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /m

      - name: Build nbis64.dll  (Release | x64)
        run: |
          msbuild Delta.Wsq\nbis\nbis.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m

      # Debug builds are not shipped, but developers build them locally;
      # make sure all four configurations in nbis.vcxproj link.
      - name: Build Debug configurations (Win32 + x64)
        run: |
          foreach ($platform in 'Win32', 'x64') {
            msbuild Delta.Wsq\nbis\nbis.vcxproj /p:Configuration=Debug /p:Platform=$platform /m
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # ── Verify: no legacy MSVC CRT dependency ─────────────────────────────
      # If msvcr*.dll appears in the dependency list the build is broken.
      # vcruntime140.dll / ucrtbase.dll are also flagged because the goal is
      # a fully standalone DLL (compiled with /MT static CRT).
      - name: Verify DLL dependencies
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vsWhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
                       Where-Object { $_.FullName -match "Hostx64\\x64" } |
                       Select-Object -First 1 -ExpandProperty FullName

          $failed = $false
          foreach ($dll in @(
            "Delta.Wsq\nbis\bin\Release\Win32\nbis32.dll",
            "Delta.Wsq\nbis\bin\Release\x64\nbis64.dll"
          )) {
            Write-Host "`n=== $dll ==="
            $output = & $dumpbin /dependents $dll
            $output | Write-Host

            # Flag any MSVC runtime that requires redistribution
            $bad = $output | Where-Object { $_ -match "msvcr\d+\.dll|vcruntime\d+\.dll|msvcp\d+\.dll" }
            if ($bad) {
              Write-Warning "$dll has unexpected runtime dependencies:`n$bad"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # ── Upload build artifacts ─────────────────────────────────────────────
      - name: Upload DLL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nbis-dll
          path: |
            Delta.Wsq\nbis\bin\Release\Win32\nbis32.dll
            Delta.Wsq\nbis\bin\Release\x64\nbis64.dll
          retention-days: 30

      # ── Upload the static libraries the DLL was linked against ────────────
      # libs=source: the freshly built libraries (use them to refresh the
      # committed ones). Otherwise: the committed libraries (release.yml
      # attaches them to the release).
      - name: Upload static library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nbis-static-libs
          path: |
            Delta.Wsq/nbis/lib32/*.a
            Delta.Wsq/nbis/lib32/SOURCE
            Delta.Wsq/nbis/lib64/*.a
            Delta.Wsq/nbis/lib64/SOURCE
          retention-days: 30

  # ── Fuzz the decoder ───────────────────────────────────────────────────────
  # The wrapper and the patched NBIS sources, built for Linux with
  # AddressSanitizer, decode tens of thousands of mutations of the sample
  # files. Any memory error, hang or lasting damage to the decoder fails the
  # job. Not run when ci.yml / release.yml only need the DLLs.
  fuzz:
    name: Fuzz the WSQ decoder (AddressSanitizer)
    if: inputs.libs != 'committed'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build with AddressSanitizer and fuzz
        run: Delta.Wsq/nbis/fuzz/run.sh "$RUNNER_TEMP/fuzz"

      - name: Upload AddressSanitizer log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-asan-log
          path: ${{ runner.temp }}/fuzz/asan.log
          retention-days: 30
