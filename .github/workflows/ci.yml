name: CI

# Fail early: cheapest checks first, each stage only runs if the previous one
# passed.
#
#   lint (ubuntu, seconds)  →  build-dll (windows)  →  test (windows)
#   - actionlint               - MSVC build against     - build + xUnit tests
#   - committed NBIS libs        committed NBIS libs     - coverage → SonarCloud
#     complete & CRT-clean     - DLL dependency check   - Debug and 32-bit runs
#                           →  build-all (windows, parallel to the above)
#                              - build.cmd: whole Delta.Wsq.sln, 4 configurations
#                              - Delta.ImageRenameTool.sln
#                              - release version stamping
#
# The full NBIS source build lives in build-nbis-dll.yml (PRs touching it,
# weekly, on demand); releases are handled by release.yml.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR makes the running pipeline obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Stage 1: static checks (no Windows runner, no build) ───────────────────
  lint:
    name: Lint workflows & check NBIS libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

      # Every .a referenced by nbis.vcxproj must exist, and none may reference
      # the legacy MinGW / VS 2010 CRT (see Delta.Wsq/nbis/BUILDING.md).
      - name: Check committed NBIS static libraries
        working-directory: Delta.Wsq/nbis
        run: |
          status=0
          # vcxproj entries look like lib32\libwsq.a → lib32/libwsq.a
          while read -r m; do
            lib="${m:0:5}/${m:6}"
            if [ ! -f "$lib" ]; then
              echo "::error file=Delta.Wsq/nbis/nbis.vcxproj::missing static library $lib"
              status=1
            elif grep -a -q -E '__imp___iob|msvcr100' "$lib"; then
              echo "::error file=Delta.Wsq/nbis/$lib::references the legacy CRT (__imp___iob / msvcr100.dll)"
              status=1
            fi
          done < <(grep -oE 'lib(32|64).lib[a-z0-9]+[.]a' nbis.vcxproj | sort -u)

          # The libraries must be built from the pinned NBIS commit with the
          # current patches: the source build records both in lib*/SOURCE.
          # shellcheck source=/dev/null
          . ./nbis-source.env
          expected="NBIS_COMMIT=$NBIS_COMMIT
          PATCHES_SHA256=$(cat patches/*.patch | sha256sum | cut -d' ' -f1)"
          for dir in lib32 lib64; do
            if [ "$(cat "$dir/SOURCE" 2>/dev/null)" != "$expected" ]; then
              echo "::error file=Delta.Wsq/nbis/$dir/SOURCE::the static libraries were not built from the current NBIS commit and patches; refresh them from the nbis-static-libs artifact of build-nbis-dll.yml (see BUILDING.md)"
              status=1
            fi
          done
          exit $status

  # ── Stage 2: native DLL ────────────────────────────────────────────────────
  build-dll:
    name: Build nbis DLL
    needs: lint
    uses: ./.github/workflows/build-nbis-dll.yml
    with:
      libs: committed

  # ── Stage 2 (parallel): everything else must at least compile ─────────────
  # The test job only builds Delta.Wsq and its tests. This job builds what
  # developers and releases build, so those cannot rot unnoticed.
  build-all:
    name: Build all projects
    needs: lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The script developers use: native DLLs, library, Paint.NET plugin,
      # test application and tests, Debug + Release, Win32 + x64.
      - name: Delta.Wsq.sln via build.cmd
        shell: cmd
        run: Delta.Wsq\build.cmd

      - name: Delta.ImageRenameTool.sln
        run: dotnet build Delta.ImageRenameTool/Delta.ImageRenameTool.sln --configuration Release

      # release.yml stamps the library with the version of the release tag.
      - name: Version stamping and XML documentation of Delta.Wsq.dll
        shell: pwsh
        run: |
          dotnet build Delta.Wsq/Delta.Wsq/Delta.Wsq.csproj --configuration Release -p:Version=9.8.7 -o "$env:RUNNER_TEMP\versioned"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = [Reflection.AssemblyName]::GetAssemblyName("$env:RUNNER_TEMP\versioned\Delta.Wsq.dll").Version
          Write-Host "Assembly version: $version"
          if ("$version" -ne '9.8.7.0') {
            Write-Host "::error::Delta.Wsq.dll has version $version, expected 9.8.7.0"
            exit 1
          }
          # The release zip ships the XML documentation next to the DLL.
          if (-not (Test-Path "$env:RUNNER_TEMP\versioned\Delta.Wsq.xml")) {
            Write-Host "::error::Delta.Wsq.xml (XML documentation) was not generated"
            exit 1
          }

  # ── Stage 3: tests + code analysis ─────────────────────────────────────────
  # One job: the SonarScanner has to wrap the build and consume the coverage
  # of the same test run, so building/testing twice would be pure duplication.
  test:
    name: Test & analyze
    needs: build-dll
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write   # dorny/test-reporter
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      TEST_PROJECT: Delta.Wsq/tests/Delta.Wsq.Tests/Delta.Wsq.Tests.csproj
      # Asserted by a test; the 32-bit step overrides it.
      DELTA_WSQ_EXPECTED_BITNESS: "64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarCloud uses history for new-code detection

      # The test project's <Content> items copy the DLLs from dependencies/
      # next to the test assembly at build time.
      - name: Download nbis DLL artifact
        uses: actions/download-artifact@v4
        with:
          name: nbis-dll
          path: Delta.Wsq/dependencies/

      - name: Flatten DLL structure
        shell: pwsh
        run: |
          Move-Item Delta.Wsq/dependencies/Win32/nbis32.dll Delta.Wsq/dependencies/ -Force
          Move-Item Delta.Wsq/dependencies/x64/nbis64.dll   Delta.Wsq/dependencies/ -Force
          Remove-Item Delta.Wsq/dependencies/Win32, Delta.Wsq/dependencies/x64 -Recurse -Force
          Get-ChildItem Delta.Wsq/dependencies/*.dll | Select-Object Name

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.TEST_PROJECT }}

      # Skipped when the secret is unavailable (e.g. PRs from forks); the
      # tests still run.
      - name: Begin SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin `
            /k:"SlOrbA_Delta.Imaging" `
            /o:"lari-korpi-personal" `
            /d:sonar.host.url=https://sonarcloud.io `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.sources=Delta.Wsq/Delta.Wsq,Delta.Wsq/tests `
            /d:sonar.test.inclusions=**/*Tests.cs `
            /d:sonar.exclusions=**/bin/**,**/obj/**,**/*.xaml.cs `
            /d:sonar.coverage.exclusions=**/Tests/**,**/TestApplication/** `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Build
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore

      - name: Run tests with coverage
        shell: pwsh
        run: |
          # Native stderr is captured too; don't let it abort the script.
          $ErrorActionPreference = 'Continue'
          dotnet test $env:TEST_PROJECT `
            --configuration Release `
            --no-build `
            --logger "trx;LogFileName=test-results.trx" `
            --logger "console;verbosity=normal" `
            --collect:"XPlat Code Coverage" `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover `
            2>&1 | Tee-Object -Variable testOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The native DLL must not print NBIS debug/progress messages (#11).
          $leaks = $testOutput | Select-String -Pattern 'frame header (read|written)|Tables for wavelet decomposition finished|WSQ reconstruction of image finished'
          if ($leaks) {
            Write-Host "::error::nbis DLL writes NBIS debug output to stderr (is 'debug' non-zero in mingw_shim.cpp?)"
            $leaks | Select-Object -First 5 | ForEach-Object { Write-Host $_ }
            exit 1
          }

      - name: End SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        shell: pwsh
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      # The library must also work when built in the default (Debug)
      # configuration, against the same release DLLs. After the Sonar step so
      # this build is not part of the analysis.
      - name: Run tests (Debug configuration)
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Debug --no-restore --logger "trx;LogFileName=test-results-debug.trx"

      # The hosted runner only has the 64-bit .NET runtime. Install the 32-bit
      # runtimes side by side and run the suite against nbis32.dll: x86 has
      # its own calling conventions and pointer size.
      - name: Run tests as a 32-bit process
        shell: pwsh
        env:
          DELTA_WSQ_EXPECTED_BITNESS: "32"
        run: |
          $x86 = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
          foreach ($runtime in 'dotnet', 'windowsdesktop') {
            # -NoPath: keep the 64-bit SDK as "dotnet"; these are runtimes only.
            & $installer -Architecture x86 -Channel 8.0 -Runtime $runtime -InstallDir $x86 -NoPath
          }
          # The installer is a PowerShell script (no exit code to check):
          # make sure both runtimes really are there before using them.
          foreach ($framework in 'Microsoft.NETCore.App', 'Microsoft.WindowsDesktop.App') {
            if (-not (Get-ChildItem "$x86\shared\$framework\8.*" -Directory -ErrorAction SilentlyContinue)) {
              Write-Host "::error::32-bit $framework 8.x was not installed to $x86"
              exit 1
            }
          }
          # Where the 32-bit test host looks for its runtime.
          ${env:DOTNET_ROOT(x86)} = $x86
          $env:DOTNET_ROOT_X86 = $x86
          dotnet test $env:TEST_PROJECT --configuration Release --arch x86 --logger "trx;LogFileName=test-results-x86.trx"
          exit $LASTEXITCODE

      # Presentation only: the test steps above decide whether the job fails.
      # The action intermittently fails with "HttpError: Not Found" when it
      # updates its check run, which must not fail an otherwise green pipeline.
      - name: Publish test results
        uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7 # v1
        if: always()
        continue-on-error: true
        with:
          name: xUnit Tests
          path: "**/*.trx"
          reporter: dotnet-trx
